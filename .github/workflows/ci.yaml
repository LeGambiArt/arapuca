name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The advisory database moves independently of this repository, so
  # the audit job below also runs on a schedule.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check-linux:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install deps
        run: dnf install -y gcc make git-core cargo clippy rustfmt libkrun-devel openssl-devel clang-devel qemu-img cbindgen

      - uses: actions/checkout@v7.0.1

      - name: Check (fmt + clippy + unit tests)
        run: make check

      # include/arapuca.h is generated and committed. Sharing it with
      # C and Go consumers means a doc or signature change that skips
      # the regenerated header leaves them reading the old contract.
      - name: Check the C header is up to date
        run: |
          make header
          # The container runs as root and the workspace is owned by
          # the runner user, so git refuses the repository as dubious
          # ownership unless it is named explicitly.
          git -c safe.directory="$PWD" diff --exit-code include/arapuca.h

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check (fmt + clippy + unit tests)
        run: make check

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install make
        run: choco install make -y

      - name: Check (fmt + clippy + unit tests)
        run: make check

  integration:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      # The unotify supervisor duplicates the wrapper's seccomp
      # listener fd with pidfd_getfd(2), which Docker's default
      # seccomp profile gates on CAP_SYS_PTRACE. Without the
      # capability every supervisor-mode test fails with
      # "pidfd_getfd failed".
      options: --cap-add SYS_PTRACE
    needs: check-linux
    steps:
      - name: Install deps
        run: dnf install -y gcc make cargo openssl-devel python3 iproute

      - uses: actions/checkout@v7.0.1

      - name: Integration tests
        run: chmod +x scripts/run-integration-tests.sh && make test-integration

  audit:
    # Deliberately not on pull requests: a new advisory against
    # untouched code must not fail an unrelated change. It runs on
    # pushes to main and weekly, where a failure means someone should
    # look rather than someone broke their build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licences, bans and sources
        run: cargo deny check
